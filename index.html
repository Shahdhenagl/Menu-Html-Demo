<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>معاينة قوائم الطعام | Restaurant Menus Demo</title>
  <meta name="description" content="نماذج وتصاميم قوائم طعام تفاعلية احترافية للمطاعم والكافيهات">
  <meta property="og:title" content="معاينة قوائم الطعام | Restaurant Menus Demo">
  <meta property="og:description" content="استعرض 6 تصميمات منيوهات تفاعلية للمطاعم والكافيهات.">
  <meta property="og:image" content="images/olivo-breakfast.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #3b82f6;
      --bar-bg: #0f172a;
      --bar-border: #1e293b;
      --body-bg: #0b1120;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: var(--body-bg);
      color: var(--text);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Minimalist Top Switcher Bar */
    .menu-switcher-bar {
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--bar-border);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      z-index: 1000;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .menu-switcher-bar::-webkit-scrollbar {
      display: none;
    }

    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .menu-tab {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .menu-tab:hover {
      background: #2a384f;
      color: #f8fafc;
      border-color: #475569;
    }

    .menu-tab.active {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Full Viewport Frame */
    .menu-viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      background-color: #faf7f2;
      position: relative;
    }

    .menu-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #faf7f2;
    }

    @media (max-width: 600px) {
      .menu-switcher-bar {
        justify-content: flex-start;
        padding: 0 10px;
      }
      .menu-tab {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Only the Menu Switcher Tabs -->
    <header class="menu-switcher-bar">
      <div class="tabs-wrapper">
        <button class="menu-tab active" onclick="switchMenu(0)">
          <span>🌿</span>
          <span>1. OLIVO</span>
        </button>

        <button class="menu-tab" onclick="switchMenu(1)">
          <span>🥢</span>
          <span>2. ZEN</span>
        </button>

        <button class="menu-tab" onclick="switchMenu(2)">
          <span>☕</span>
          <span>3. DAILY CUP</span>
        </button>

        <button class="menu-tab" onclick="switchMenu(3)">
          <span>🔥</span>
          <span>4. GRILL STATION</span>
        </button>

        <button class="menu-tab" onclick="switchMenu(4)">
          <span>⚓</span>
          <span>5. BLUE OCEAN</span>
        </button>

        <button class="menu-tab" onclick="switchMenu(5)">
          <span>🥩</span>
          <span>6. PRIME</span>
        </button>
      </div>
    </header>

    <!-- Fullscreen Menu Viewport -->
    <main class="menu-viewport">
      <iframe id="activeMenuIframe" class="menu-iframe" src="menu-1-olivo.html"></iframe>
    </main>

  </div>

  <script>
    const menus = [
      { id: 'olivo', file: 'menu-1-olivo.html' },
      { id: 'zen', file: 'menu-2-zen.html' },
      { id: 'daily-cup', file: 'menu-3-daily-cup.html' },
      { id: 'grill', file: 'menu-4-grill-station.html' },
      { id: 'blue-ocean', file: 'menu-5-blue-ocean.html' },
      { id: 'prime', file: 'menu-6-prime-steakhouse.html' }
    ];

    let currentIdx = 0;

    function init() {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      const hashIdx = menus.findIndex(m => m.id === hash);
      if (hashIdx !== -1) {
        switchMenu(hashIdx, false);
      }
    }

    function switchMenu(idx, updateHash = true) {
      currentIdx = idx;
      const target = menus[idx];
      document.getElementById('activeMenuIframe').src = target.file;

      const tabs = document.querySelectorAll('.menu-tab');
      tabs.forEach((tab, i) => {
        if (i === idx) {
          tab.classList.add('active');
          tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          tab.classList.remove('active');
        }
      });

      if (updateHash) {
        window.history.replaceState(null, null, '#' + target.id);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '').toLowerCase();
      const idx = menus.findIndex(m => m.id === hash);
      if (idx !== -1 && idx !== currentIdx) {
        switchMenu(idx, false);
      }
    });
  </script>
</body>
</html>
